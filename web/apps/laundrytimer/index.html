<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laundry">
<meta name="theme-color" content="#EDEAE3">
<title>Laundry Timer</title>
<link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="cc-frame.css">
<style>
  :root{
    --bg:#EDEAE3;
    --panel:#FAF9F5;
    --ink:#2B2A28;
    --ink-soft:#8A847A;
    --wash:#2F5D82;
    --wash-soft:#DCE7EE;
    --dry:#C2622F;
    --dry-soft:#F3E0D2;
    --ring-track:#D8D3C7;
    --accent: var(--wash);
    --accent-soft: var(--wash-soft);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:420px;
    height:100vh;
    max-height:900px;
    display:flex;
    flex-direction:column;
    padding:24px 22px;
    position:relative;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 4px 2px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 16px 2px;
  }
  .tabs{
    display:flex;
    background:var(--panel);
    border-radius:14px;
    padding:4px;
    gap:4px;
    box-shadow: inset 0 0 0 1px rgba(43,42,40,0.06);
  }
  .tab{
    flex:1;
    border:none;
    background:transparent;
    padding:12px 0;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .tab.active.wash-tab{ background:var(--wash); color:#fff; }
  .tab.active.dry-tab{ background:var(--dry); color:#fff; }
  .tab:disabled{ opacity:0.45; cursor:default; }

  .dial-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin:14px 0 6px;
    min-height:0;
    touch-action:none;
  }
  svg{ width:min(74vw,290px); height:min(74vw,290px); display:block; touch-action:none; }
  .ring-track{ fill:none; stroke:var(--ring-track); stroke-width:14; }
  .ring-band{ fill:none; stroke:var(--accent); stroke-width:14; opacity:0.28; transition:stroke .3s; }
  .ring-progress{
    fill:none;
    stroke:var(--accent);
    stroke-width:14;
    stroke-linecap:round;
    transform:rotate(-90deg);
    transform-origin:150px 150px;
    transition:stroke-dashoffset .12s linear, stroke .3s;
  }
  .ring-progress.running{ transition:stroke-dashoffset 1s linear, stroke .3s; }
  .ring-lap{
    fill:none;
    stroke-width:14;
    stroke-linecap:round;
    display:none;
    transition:stroke-dashoffset .12s linear;
  }
  .ring-lap.running{ transition:stroke-dashoffset 1s linear; }
  .tick{ stroke:var(--ink); opacity:0.13; stroke-width:2; }
  .tick.major{ opacity:0.24; stroke-width:3; }
  .door-glass{ fill:var(--panel); }
  .bolt{ fill:var(--ink); opacity:0.13; }
  .knob{
    fill:var(--panel);
    stroke:var(--accent);
    stroke-width:5;
    cursor:grab;
    filter: drop-shadow(0 2px 3px rgba(43,42,40,0.25));
  }
  .knob.fine{ stroke:var(--dry); }

  .dial-center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    pointer-events:none;
  }
  .time-readout{
    font-family: ui-monospace, "SF Mono", "Menlo", monospace;
    font-size:52px;
    font-weight:600;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
    line-height:1;
    background:transparent;
    border:none;
    color:var(--ink);
    text-align:center;
    width:150px;
    pointer-events:auto;
    -webkit-appearance:none;
    appearance:textfield;
  }
  input.time-readout:focus{ outline:none; }
  input.time-readout::-webkit-inner-spin-button,
  input.time-readout::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .time-unit{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:8px;
    font-weight:600;
  }
  .tap-hint{
    font-size:10px;
    color:var(--ink-soft);
    opacity:0.7;
    margin-top:2px;
  }
  .state-label{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-top:6px;
  }

  .step-row{
    display:flex;
    gap:10px;
    margin-bottom:10px;
  }
  .step-text-btn{
    flex:1;
    border:none;
    padding:14px 0;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    cursor:pointer;
  }
  .step-text-btn:active{ opacity:0.75; }

  .controls{ display:flex; flex-direction:column; gap:10px; margin-top:2px; }
  button.primary{
    border:none;
    padding:17px 0;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    color:#fff;
    background:var(--accent);
    cursor:pointer;
  }
  button.primary:active{ opacity:0.85; }
  button.secondary{
    border:none;
    padding:14px 0;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    background:transparent;
    box-shadow: inset 0 0 0 1px rgba(43,42,40,0.12);
    cursor:pointer;
  }
  .hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.5;
  }

  /* ---- Alarm overlay ---- */
  #alarm{
    position:fixed; inset:0;
    background:var(--accent);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    z-index:20;
    text-align:center;
  }
  #alarm.show{ display:flex; }
  .alarm-ring{
    width:150px; height:150px;
    border-radius:50%;
    border:6px solid rgba(255,255,255,0.5);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:26px;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); border-color:rgba(255,255,255,0.5); }
    50%{ transform:scale(1.07); border-color:rgba(255,255,255,0.95); }
  }
  .alarm-ring svg{ width:60px; height:60px; }
  .alarm-title{ color:#fff; font-size:22px; font-weight:700; margin-bottom:6px; }
  .alarm-sub{ color:rgba(255,255,255,0.8); font-size:14px; margin-bottom:34px; }
  .alarm-actions{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:12px; }
  .alarm-btn{
    border:none;
    padding:17px 0;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .alarm-btn.main{ background:#fff; color:var(--ink); }
  .alarm-btn.ghost{ background:rgba(255,255,255,0.16); color:#fff; }

  @media (prefers-reduced-motion: reduce){
    .alarm-ring{ animation:none; }
    .ring-progress{ transition:none; }
  }
</style>
</head>
<body>
<a class="cc-home" href="../../index.html#/">‹ Home</a>

<div id="app">
  <p class="eyebrow">Laundry Timer</p>
  <h1 id="headline">Set the wash</h1>

  <div class="tabs">
    <button class="tab wash-tab active" id="tabWash">Wash</button>
    <button class="tab dry-tab" id="tabDry">Dry</button>
  </div>

  <div class="dial-wrap" id="dialWrap">
    <svg id="dialSvg" viewBox="0 0 300 300">
      <circle class="door-glass" cx="150" cy="150" r="118"></circle>
      <g id="ticks"></g>
      <circle class="ring-track" cx="150" cy="150" r="130"></circle>
      <circle class="ring-band" id="ringBand" cx="150" cy="150" r="130" transform="rotate(-90 150 150)"></circle>
      <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130"></circle>
      <circle class="ring-lap" id="ringLap1" cx="150" cy="150" r="130" transform="rotate(-90 150 150)"></circle>
      <circle class="ring-lap" id="ringLap2" cx="150" cy="150" r="130" transform="rotate(-90 150 150)"></circle>
      <circle class="ring-lap" id="ringLap3" cx="150" cy="150" r="130" transform="rotate(-90 150 150)"></circle>
      <circle class="bolt" cx="150" cy="30" r="4"></circle>
      <circle class="bolt" cx="270" cy="150" r="4"></circle>
      <circle class="bolt" cx="150" cy="270" r="4"></circle>
      <circle class="bolt" cx="30" cy="150" r="4"></circle>
      <circle class="knob" id="dialKnob" r="13" cx="150" cy="20"></circle>
    </svg>
    <div class="dial-center" id="dialCenter">
      <input class="time-readout" id="timeInput" inputmode="numeric" type="number" min="1" max="240" value="35">
      <div class="time-unit">minutes</div>
      <div class="tap-hint">drag the dial, or tap to type</div>
    </div>
  </div>

  <div class="step-row" id="stepRow">
    <button class="step-text-btn" id="minus">Subtract 5 minutes</button>
    <button class="step-text-btn" id="plus">Add 5 minutes</button>
  </div>

  <div class="controls" id="controlsIdle">
    <button class="primary" id="startBtn">Start wash timer</button>
  </div>

  <div class="controls" id="controlsRunning" style="display:none;">
    <button class="secondary" id="cancelBtn">Cancel timer</button>
  </div>

  <p class="hint" id="hintLine">Keep this tab open so the alarm can sound when the cycle ends.</p>
</div>

<div id="alarm">
  <div class="alarm-ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="alarm-title" id="alarmTitle">Wash cycle done</div>
  <div class="alarm-sub" id="alarmSub">Time to move it to the dryer.</div>
  <div class="alarm-actions" id="alarmActions"></div>
</div>

<script>
(function(){
  "use strict";

  var LAP_MINUTES = 60;        // one full turn of the dial = 60 minutes, like a clock face
  var SUGGESTED = { min:30, max:60, step:5 };
  var MODE_RANGE = {
    wash: { floor:1,  ceil:120, default:35 },
    dry:  { floor:0,  ceil:120, default:60 }
  };
  var COLORS = { wash: {main:"#2F5D82", soft:"#DCE7EE"}, dry: {main:"#C2622F", soft:"#F3E0D2"} };

  var state = {
    mode: "wash",
    minutes: MODE_RANGE.wash.default,
    running: false,
    endAt: null,
    durationMs: 0,
    wakeLock: null
  };

  var els = {
    tabWash: document.getElementById("tabWash"),
    tabDry: document.getElementById("tabDry"),
    headline: document.getElementById("headline"),
    minus: document.getElementById("minus"),
    plus: document.getElementById("plus"),
    timeInput: document.getElementById("timeInput"),
    dialWrap: document.getElementById("dialWrap"),
    dialSvg: document.getElementById("dialSvg"),
    dialCenter: document.getElementById("dialCenter"),
    stepRow: document.getElementById("stepRow"),
    startBtn: document.getElementById("startBtn"),
    cancelBtn: document.getElementById("cancelBtn"),
    controlsIdle: document.getElementById("controlsIdle"),
    controlsRunning: document.getElementById("controlsRunning"),
    ring: document.getElementById("ringProgress"),
    ringBand: document.getElementById("ringBand"),
    ringLaps: [document.getElementById("ringLap1"), document.getElementById("ringLap2"), document.getElementById("ringLap3")],
    knob: document.getElementById("dialKnob"),
    ticks: document.getElementById("ticks"),
    hint: document.getElementById("hintLine"),
    alarm: document.getElementById("alarm"),
    alarmTitle: document.getElementById("alarmTitle"),
    alarmSub: document.getElementById("alarmSub"),
    alarmActions: document.getElementById("alarmActions"),
    root: document.documentElement
  };

  var RING_R = 130, RING_C = 2 * Math.PI * RING_R;
  els.ring.style.strokeDasharray = RING_C.toFixed(2);

  // ---- decorative clock-face ticks ----
  function buildTicks(){
    var n = 24;
    var frag = "";
    for (var k = 0; k < n; k++){
      var a = (2 * Math.PI * k / n) - Math.PI/2;
      var major = (k % 6 === 0);
      var x1 = 150 + Math.cos(a) * 143, y1 = 150 + Math.sin(a) * 143;
      var x2 = 150 + Math.cos(a) * (major ? 132 : 138), y2 = 150 + Math.sin(a) * (major ? 132 : 138);
      frag += '<line class="tick'+(major?' major':'')+'" x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
    }
    els.ticks.innerHTML = frag;
  }

  // ---- suggested band arc (fixed, drawn once per color change) ----
  // 30 min sits at 180deg (6 o'clock), 60 min completes the lap back at the top.
  function buildBand(){
    var s = SUGGESTED.min / LAP_MINUTES, e = SUGGESTED.max / LAP_MINUTES;
    var bandLen = RING_C * (e - s);
    els.ringBand.style.strokeDasharray = bandLen.toFixed(2) + " " + RING_C.toFixed(2);
    els.ringBand.style.strokeDashoffset = (-RING_C * s).toFixed(2);
  }

  // darken a #rrggbb hex color by subtracting from each channel
  function shade(hex, amt){
    var num = parseInt(hex.slice(1), 16);
    var r = Math.min(255, Math.max(0, (num >> 16) - amt));
    var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) - amt));
    var b = Math.min(255, Math.max(0, (num & 0xff) - amt));
    return "#" + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function setColorVars(mode){
    els.root.style.setProperty("--accent", COLORS[mode].main);
    els.root.style.setProperty("--accent-soft", COLORS[mode].soft);
    var base = COLORS[mode].main;
    var shades = [35, 65, 95];
    els.ringLaps.forEach(function(el, i){ el.style.stroke = shade(base, shades[i]); });
  }

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function clamp(v){
    var r = MODE_RANGE[state.mode];
    return Math.min(r.ceil, Math.max(r.floor, v));
  }

  // fraction of the CURRENT lap only (0-1), used to place the knob on the dial
  function lapFraction(minutes){
    var m = minutes % LAP_MINUTES;
    return m / LAP_MINUTES;
  }

  function positionKnob(minutes){
    var f = lapFraction(minutes);
    var angle = (-90 + f * 360) * Math.PI / 180;
    var x = 150 + RING_R * Math.cos(angle);
    var y = 150 + RING_R * Math.sin(angle);
    els.knob.setAttribute("cx", x.toFixed(2));
    els.knob.setAttribute("cy", y.toFixed(2));
  }

  // draws the base ring (0-60 min) plus darker overlay rings for each full hour beyond the first
  function renderValueRings(displayMinutes){
    var lap0 = Math.min(displayMinutes, LAP_MINUTES) / LAP_MINUTES;
    els.ring.style.strokeDashoffset = (RING_C * (1 - lap0)).toFixed(2);
    for (var i = 0; i < 3; i++){
      var el = els.ringLaps[i];
      var m = Math.min(Math.max(displayMinutes - LAP_MINUTES * (i + 1), 0), LAP_MINUTES);
      var f = m / LAP_MINUTES;
      if (f > 0){
        el.style.display = "inline";
        el.style.strokeDasharray = RING_C.toFixed(2);
        el.style.strokeDashoffset = (RING_C * (1 - f)).toFixed(2);
      } else {
        el.style.display = "none";
      }
    }
  }

  function renderIdle(){
    var r = MODE_RANGE[state.mode];
    els.timeInput.min = r.floor;
    els.timeInput.max = r.ceil;
    els.timeInput.value = state.minutes;
    els.ring.classList.remove("running");
    els.ringLaps.forEach(function(el){ el.classList.remove("running"); });
    renderValueRings(state.minutes);
    positionKnob(state.minutes);
    els.knob.style.display = "";
    els.headline.textContent = "Set the " + state.mode;
    els.startBtn.textContent = "Start " + state.mode + " timer";
    els.hint.textContent = "Keep this tab open so the alarm can sound when the cycle ends.";
    els.controlsIdle.style.display = "flex";
    els.controlsRunning.style.display = "none";
    els.stepRow.style.display = "flex";
    els.tabWash.disabled = false;
    els.tabDry.disabled = false;
  }

  function renderRunningTick(){
    var remainingMs = Math.max(0, state.endAt - Date.now());
    var totalSec = Math.round(remainingMs / 1000);
    var mm = Math.floor(totalSec / 60), ss = totalSec % 60;
    els.timeInput.style.display = "none";
    var existingLabel = els.dialCenter.querySelector(".run-readout");
    var runHtml =
      '<div class="run-readout" style="pointer-events:none;">' +
        '<div class="time-readout" style="width:auto;">' + mm + ':' + pad(ss) + '</div>' +
        '<div class="time-unit">remaining</div>' +
        '<div class="state-label">' + state.mode.toUpperCase() + ' RUNNING</div>' +
      '</div>';
    if (!existingLabel){
      els.dialCenter.insertAdjacentHTML("beforeend", runHtml);
    } else {
      existingLabel.querySelector(".time-readout").textContent = mm + ':' + pad(ss);
    }
    var elapsedMinutes = state.minutes - (remainingMs / 60000);
    elapsedMinutes = Math.min(state.minutes, Math.max(0, elapsedMinutes));
    renderValueRings(elapsedMinutes);
    document.title = mm + ":" + pad(ss) + " · " + state.mode;

    if (remainingMs <= 0){ finishCycle(); }
  }

  function renderRunningShell(){
    els.headline.textContent = state.mode === "wash" ? "Washing" : "Drying";
    els.controlsIdle.style.display = "none";
    els.controlsRunning.style.display = "flex";
    els.stepRow.style.display = "none";
    els.knob.style.display = "none";
    els.hint.textContent = "The alarm sounds right here — keep this tab open and your phone unlocked or nearby.";
    els.tabWash.disabled = true;
    els.tabDry.disabled = true;
    els.ring.classList.add("running");
    els.ringLaps.forEach(function(el){ el.classList.add("running"); });
    renderRunningTick();
  }

  function clearRunReadout(){
    var el = els.dialCenter.querySelector(".run-readout");
    if (el) el.remove();
    els.timeInput.style.display = "";
  }

  var tickTimer = null;
  function startTicking(){ stopTicking(); tickTimer = setInterval(renderRunningTick, 1000); }
  function stopTicking(){ if (tickTimer){ clearInterval(tickTimer); tickTimer = null; } }

  function requestWakeLock(){
    if ("wakeLock" in navigator){
      navigator.wakeLock.request("screen").then(function(lock){ state.wakeLock = lock; }).catch(function(){});
    }
  }
  function releaseWakeLock(){
    if (state.wakeLock){ state.wakeLock.release().catch(function(){}); state.wakeLock = null; }
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "visible" && state.running){ requestWakeLock(); }
  });

  var audioCtx = null;
  var alarmInterval = null;
  function beep(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      [0, 0.28, 0.56].forEach(function(offset){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.5, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.24);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.26);
      });
    }catch(e){}
  }
  function startAlarmSound(){
    beep();
    alarmInterval = setInterval(beep, 1500);
    if (navigator.vibrate) { try{ navigator.vibrate([300,150,300,150,300]); }catch(e){} }
  }
  function stopAlarmSound(){ if (alarmInterval){ clearInterval(alarmInterval); alarmInterval = null; } }

  function save(){
    try{
      localStorage.setItem("laundryTimer", JSON.stringify({
        mode: state.mode, minutes: state.minutes, running: state.running, endAt: state.endAt, durationMs: state.durationMs
      }));
    }catch(e){}
  }
  function clearSave(){ try{ localStorage.removeItem("laundryTimer"); }catch(e){} }
  function restore(){
    try{
      var raw = localStorage.getItem("laundryTimer");
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d.running && d.endAt){
        state.mode = d.mode; state.minutes = d.minutes; state.durationMs = d.durationMs; state.endAt = d.endAt;
        if (Date.now() >= d.endAt){
          state.running = false; clearSave();
          triggerAlarmFor(d.mode);
        } else {
          state.running = true;
          setColorVars(state.mode);
          switchTabsUI(state.mode);
          renderRunningShell();
          startTicking();
          requestWakeLock();
        }
      }
    }catch(e){}
  }

  function switchTabsUI(mode){
    els.tabWash.classList.toggle("active", mode === "wash");
    els.tabDry.classList.toggle("active", mode === "dry");
  }
  function setMode(mode){
    if (state.running) return;
    state.mode = mode;
    state.minutes = MODE_RANGE[mode].default;
    setColorVars(mode);
    switchTabsUI(mode);
    buildBand();
    renderIdle();
  }
  els.tabWash.addEventListener("click", function(){ setMode("wash"); });
  els.tabDry.addEventListener("click", function(){ setMode("dry"); });

  els.minus.addEventListener("click", function(){
    state.minutes = clamp(state.minutes - SUGGESTED.step);
    renderIdle();
  });
  els.plus.addEventListener("click", function(){
    state.minutes = clamp(state.minutes + SUGGESTED.step);
    renderIdle();
  });

  function commitTyped(){
    var v = parseInt(els.timeInput.value, 10);
    if (isNaN(v)) v = MODE_RANGE[state.mode].default;
    state.minutes = clamp(v);
    renderIdle();
  }
  els.timeInput.addEventListener("focus", function(){ this.select(); });
  els.timeInput.addEventListener("change", commitTyped);
  els.timeInput.addEventListener("blur", commitTyped);

  // ---- Drag-to-set dial ----
  // The dial is one clock face per lap (60 min). Spinning past 12 o'clock rolls
  // over into the next hour, tracked via dragLaps so values above 60 work too.
  var dragging = false;
  var fineMode = false;
  var fineTimer = null;
  var pointerId = null;
  var dragLaps = 0;
  var dragPrevFrac = 0;

  function svgPointFromEvent(evt){
    var rect = els.dialSvg.getBoundingClientRect();
    var scale = 300 / rect.width;
    var x = (evt.clientX - rect.left) * scale;
    var y = (evt.clientY - rect.top) * scale;
    return { x: x - 150, y: y - 150 };
  }

  function fracFromPoint(pt){
    var rawDeg = Math.atan2(pt.y, pt.x) * 180 / Math.PI; // 0deg at 3 o'clock, clockwise-increasing
    return ((rawDeg + 90) % 360 + 360) % 360 / 360; // 0 at 12 o'clock, clockwise
  }

  function applyDragValue(evt, isStart){
    var pt = svgPointFromEvent(evt);
    var f = fracFromPoint(pt);
    if (isStart){
      dragLaps = Math.floor(state.minutes / LAP_MINUTES);
      dragPrevFrac = f;
    } else {
      var delta = f - dragPrevFrac;
      if (delta < -0.5) dragLaps += 1;      // spun forward past 12 o'clock
      else if (delta > 0.5) dragLaps -= 1;  // spun backward past 12 o'clock
      dragPrevFrac = f;
    }
    var raw = (dragLaps + f) * LAP_MINUTES;
    var step = fineMode ? 1 : SUGGESTED.step;
    var snapped = Math.round(raw / step) * step;
    snapped = clamp(snapped);
    if (snapped !== state.minutes){
      state.minutes = snapped;
      renderIdle();
    }
    els.knob.classList.toggle("fine", fineMode);
  }

  els.dialSvg.addEventListener("pointerdown", function(evt){
    if (state.running) return;
    dragging = true;
    fineMode = false;
    pointerId = evt.pointerId;
    els.dialSvg.setPointerCapture(pointerId);
    fineTimer = setTimeout(function(){ fineMode = true; }, 550);
    applyDragValue(evt, true);
    evt.preventDefault();
  });
  els.dialSvg.addEventListener("pointermove", function(evt){
    if (!dragging) return;
    applyDragValue(evt, false);
    evt.preventDefault();
  });
  function endDrag(evt){
    if (!dragging) return;
    dragging = false;
    fineMode = false;
    els.knob.classList.remove("fine");
    if (fineTimer){ clearTimeout(fineTimer); fineTimer = null; }
    try{ els.dialSvg.releasePointerCapture(pointerId); }catch(e){}
  }
  els.dialSvg.addEventListener("pointerup", endDrag);
  els.dialSvg.addEventListener("pointercancel", endDrag);

  function startTimer(mode, minutes){
    state.mode = mode;
    state.minutes = minutes;
    state.durationMs = minutes * 60 * 1000;
    state.endAt = Date.now() + state.durationMs;
    state.running = true;
    setColorVars(mode);
    switchTabsUI(mode);
    save();
    renderRunningShell();
    startTicking();
    requestWakeLock();
  }
  els.startBtn.addEventListener("click", function(){ startTimer(state.mode, state.minutes); });
  els.cancelBtn.addEventListener("click", function(){
    state.running = false;
    stopTicking();
    releaseWakeLock();
    clearSave();
    clearRunReadout();
    document.title = "Laundry Timer";
    renderIdle();
  });

  function finishCycle(){
    stopTicking();
    releaseWakeLock();
    var finishedMode = state.mode;
    state.running = false;
    clearSave();
    document.title = "Laundry Timer";
    triggerAlarmFor(finishedMode);
  }

  function triggerAlarmFor(finishedMode){
    setColorVars(finishedMode);
    els.alarmTitle.textContent = (finishedMode === "wash" ? "Wash" : "Dry") + " cycle done";
    els.alarmSub.textContent = finishedMode === "wash"
      ? "Time to move it to the dryer."
      : "Time to fold — it's dry.";

    var actionsHtml = "";
    if (finishedMode === "wash"){
      actionsHtml =
        '<button class="alarm-btn main" id="actStartDryer">Start dryer timer</button>' +
        '<button class="alarm-btn ghost" id="actDismiss">Dismiss</button>';
    } else {
      actionsHtml = '<button class="alarm-btn main" id="actDismiss">Dismiss</button>';
    }
    els.alarmActions.innerHTML = actionsHtml;

    els.alarm.classList.add("show");
    startAlarmSound();

    document.getElementById("actDismiss").addEventListener("click", closeAlarm);
    var startNow = document.getElementById("actStartDryer");
    if (startNow) startNow.addEventListener("click", function(){
      closeAlarm(); clearRunReadout();
      setMode("dry");
    });
  }

  function closeAlarm(){
    stopAlarmSound();
    els.alarm.classList.remove("show");
    clearRunReadout();
  }

  // ---- Init ----
  buildTicks();
  setColorVars("wash");
  buildBand();
  renderIdle();
  restore();

  window.addEventListener("beforeunload", function(){ if (state.running) save(); });
})();
</script>
<!-- (In Command Center: its service worker keeps this page offline.) -->
</body>
</html>
